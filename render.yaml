services:
  - type: web
    name: clip-saver
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MAX_DURATION_SECONDS
        value: "3600"
      - key: MAX_FILESIZE_MB
        value: "1500"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: JOB_TTL_SECONDS
        value: "900"
